[project]
name = "fh-blog"
version = "0.1.0"
description = "A FastHTML blog with markdown posts and live code execution"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.tasks]
dev = "RELOAD=1 python app.py"
start = "python app.py"

[tool.pixi.dependencies]
python = ">=3.12"
python-fasthtml = ">=0.14.11,<0.15"
pyyaml = ">=6.0"
monsterui = ">=1.0.19,<2"
pydantic = ">=2.0.0"

[tool.pixi.pypi-dependencies]
fh-posts = "*"
httpx = "*"
